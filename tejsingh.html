<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB0SjW-8MyzpXPqHoz7rVcwFcjPZdK0818",
    authDomain: "like-buttonzz02.firebaseapp.com",
    projectId: "like-buttonzz02",
    storageBucket: "like-buttonzz02.firebasestorage.app",
    messagingSenderId: "353825131332",
    appId: "1:353825131332:web:63b01c551aecff0db2e511"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let numLikes = document.querySelectorAll('.numLikes');
  let likeButtons = document.querySelectorAll('.likeButtons');

  for (let i = 0; i < likeButtons.length; i++) {
    let numberLikes = 0;

    // Step 26: Read from Firebase and sync local counter
    onValue(ref(db, "project " + i + "/numLikes"), (snapshot) => {
      let data = snapshot.val();
      if (data !== null) {
        numberLikes = data; // <--- THIS WAS MISSING
        numLikes[i].innerHTML = data;
      }
    });

    // Step 21: Increment synced counter on click
    likeButtons[i].addEventListener('click', function() {
      numberLikes++;
      set(ref(db, "project " + i), {
        numLikes: numberLikes
      });
    });
  }
</script>
